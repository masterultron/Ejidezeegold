[build]
  base = "."
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NETLIFY_USE_PNPM = "true"

[[redirects]]
  from = "/api/order-notify"
  to = "/.netlify/functions/order-notify"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200